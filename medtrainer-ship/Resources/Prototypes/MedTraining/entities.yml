- type: entity
  id: MobMedTrainingParamedic
  parent: MobHumanSyndicateAgentBase
  name: paramedic
  description: Paramedic to deliver patient. 
  components:
    - type: MobThresholds
      thresholds:
        0: Alive
        200: Dead
    - type: HTN
      rootTask:
        task: MedParamedicDeliver
    - type: NpcFactionMember
      factions:
        - NanoTrasen
    - type: MedTrainingParamedic

# Reset button

- type: entity
  id: MedTrainingReadyButton
  name: next patient button
  description: Press this button to spawn in new patient.
  components:
    - type: Transform
    - type: WallMount
      arc: 360
    - type: Physics
      canCollide: false
    - type: Clickable
    - type: Sprite
      sprite: Structures/Wallmounts/switch.rsi
      state: on
    - type: InteractionOutline
    - type: MedTrainingButton

# Spawn settings button

- type: entity
  id: MedTrainingSettingsButton
  name: spawn settings button
  description: Press this button to adjust patient damage at spawn.
  components:
    - type: Transform
    - type: WallMount
      arc: 360
    - type: Physics
      canCollide: false
    - type: Clickable
    - type: Sprite
      sprite: Structures/Wallmounts/switch.rsi
      state: on
      color: "#FFA500"
    - type: InteractionOutline
    - type: MedTrainingSettingsButton
    - type: ActivatableUI
      key: enum.MedTrainingSpawnSettingsUiKey.Key
    - type: UserInterface
      interfaces:
        enum.MedTrainingSpawnSettingsUiKey.Key:
          type: MedTrainingSpawnSettingsBoundUserInterface

# Scenario coordinator

- type: entity
  id: MedTrainingScenarioCoordinator
  name: med training scenario
  suffix: DoNotDelete
  components:
    - type: Transform
    - type: MedTrainingScenario
    - type: MedTrainingSpawnSettings

# Stasis bed unique

- type: entity
  id: MedTrainingStasisBed
  parent: StasisBed
  name: stasis bed
  suffix: MedTraining
  components:
