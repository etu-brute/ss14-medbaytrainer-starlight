- type: entity
  id: MobMedTrainingPatientMixin
  abstract: true
  name: patient
  description: Patient spawned in for player to treat.
  components:
    - type: MobThresholds
      thresholds:
        0: Alive
        100: Critical
        200: Dead
    - type: HTN
      rootTask:
        task: MedPatientIdle
    - type: NpcFactionMember
      factions:
        - NanoTrasen

- type: entity
  id: MobMedTrainingPatientHuman
  parent: [MobHuman, MobMedTrainingPatientMixin]
  name: patient
  suffix: Human

